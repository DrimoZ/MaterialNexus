plugins {
    id 'java-library'
    id 'maven-publish'
    // Forge 1.20.1 port: the ModDevGradle line for legacy Forge, same DSL as the NeoForge build on main.
    id 'net.neoforged.moddev.legacyforge' version '2.0.75'
}

version = "${mod_version}+${minecraft_version}"
group = mod_group_id
base { archivesName = mod_id }

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

legacyForge {
    version = "${minecraft_version}-${forge_version}"

    parchment {
        minecraftVersion = project.parchment_minecraft_version
        mappingsVersion = project.parchment_mappings_version
    }

    runs {
        client {
            client()
            gameDirectory = project.file('run')
            systemProperty 'forge.enabledGameTestNamespaces', mod_id
        }
        // MNX-049: dev-only UI screenshots. Copies the dev world and config to run-ui (the dev world is never touched),
        // opens the world, walks the Material Nexus screen and saves screenshots to run-ui/screenshots, then quits.
        uiShots {
            client()
            gameDirectory = project.file("run-ui")
            systemProperty "materialnexus.uishots", "true"
            programArguments.addAll "--quickPlaySingleplayer", "New World", "--width", "2000", "--height", "1070"
        }
        server {
            server()
            gameDirectory = project.file('run')
            programArgument '--nogui'
            systemProperty 'forge.enabledGameTestNamespaces', mod_id
        }
        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = project.file('run-gametest')
            systemProperty 'forge.enabledGameTestNamespaces', mod_id
        }
        data {
            data()
            gameDirectory = project.file('run-data')
            programArguments.addAll '--mod', mod_id,
                    '--all',
                    '--output', file('src/generated/resources/').absolutePath,
                    '--existing', file('src/main/resources/').absolutePath
        }
        configureEach {
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// legacyforge has no unitTest setup: the JUnit tests are pure (ids, codecs, JSON), the game classes on the
// classpath are enough, no FML bootstrap needed.
sourceSets.test {
    compileClasspath += sourceSets.main.compileClasspath
    runtimeClasspath += sourceSets.main.runtimeClasspath
}

repositories {
    mavenCentral()
    maven {
        name = "BlameJared (JEI)"
        url = "https://maven.blamejared.com"
    }
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content { includeGroup 'maven.modrinth' }
    }
    maven {
        name = "Latvian (KubeJS)"
        url = "https://maven.latvian.dev/releases"
        content { includeGroup 'dev.latvian.mods' }
    }
}

dependencies {
    // Optional viewer integrations: compile against the API, never make the viewer a hard dependency.
    // Forge 1.20.1 mod jars are SRG-named: the mod* configurations remap them to the dev mappings.
    modCompileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    modCompileOnly "mezz.jei:jei-${minecraft_version}-forge-api:${jei_version}"
    // EMI: compiled against for the viewer adapter only; `-Pemi` adds it to the dev run.
    modCompileOnly "maven.modrinth:emi:${emi_version}"
    if (project.hasProperty('emi')) {
        modRuntimeOnly "maven.modrinth:emi:${emi_version}"
    }

    // KubeJS: compiled against for the script bindings only (MNX-067, ADR-001); `-Pkubejs` adds it to the dev runs.
    modCompileOnly "dev.latvian.mods:kubejs-forge:${kubejs_version}"
    modCompileOnly "dev.latvian.mods:rhino-forge:${rhino_version}"
    if (project.hasProperty("kubejs")) {
        modRuntimeOnly "maven.modrinth:kubejs:${kubejs_modrinth}"
        modRuntimeOnly "maven.modrinth:rhino:${rhino_modrinth}"
        modRuntimeOnly "maven.modrinth:architectury-api:${architectury_version}"
    }

    // Almost Unified: `-Pau` adds it to the dev runs, to check the domain arbitration (ADR-012) against the real mod.
    if (project.hasProperty("au")) {
        modRuntimeOnly "maven.modrinth:almostunified:${almostunified_version}"
    }

    // A small real pack for the dev runs: overlapping copper/tin/lead/silver providers are what discovery and
    // resolution exist for. runtimeOnly, never compiled against or shipped. Modern Industrialization has no
    // Forge 1.20.1 build, so it is not part of this pack.
    if (!project.hasProperty('vanilla')) {
        modRuntimeOnly "mezz.jei:jei-${minecraft_version}-forge:${jei_version}"
        modRuntimeOnly "maven.modrinth:jade:${jade_version}"
        modRuntimeOnly "maven.modrinth:mekanism:${mekanism_version}"
        modRuntimeOnly "maven.modrinth:create:${create_version}"
        modRuntimeOnly "maven.modrinth:immersiveengineering:${immersiveengineering_version}"
        modRuntimeOnly "maven.modrinth:ae2:${ae2_version}"
        modRuntimeOnly "maven.modrinth:guideme:${guideme_version}"
        modRuntimeOnly "maven.modrinth:createaddition:${createaddition_version}"
        modRuntimeOnly "maven.modrinth:create-metallurgy:${create_metallurgy_version}"

        // A big-pack layer: metal-heavy mods with overlapping copper/tin/lead/silver/nickel/aluminum/steel providers,
        // their own recipe types and tag habits. Modrinth version ids (version number in the comment); libraries last.
        [
            'mekanism-generators'         : 'Th4Czz4N', // 10.4.16.80
            'mekanism-tools'              : 'VzpFbUpF', // 10.4.16.80
            'immersivepetroleum'          : 'iOSlao7R', // 4.3.0-36b
            'extreme-reactors'            : '5A5jbWkI', // 1.20.1-2.0.84
            'silent-gear'                 : '2Chvw4VA', // 3.6.7
            'occultism'                   : 'hs5pHmiU', // 1.20.1-1.158.0
            'gregtechceu-modern'          : 'yLwvjuvy', // 7.5.3
            'powah'                       : 'xDOvxyqP', // 5.0.11
            'industrial-foregoing'        : '5XXYqEMK', // 1.20.1-3.5.22
            'enderio'                     : 'nJnmg29v', // 6.2.18-beta
            'botania'                     : 'npY4sRWF', // 1.20.1-456
            'create-new-age'              : '7vnwbouk', // 1.2.0
            'create-big-cannons'          : 'ZRgu5o3x', // 5.11.4
            'create-tfmg'                 : 'ZNOx0jhg', // 1.0.2f
            'ad-astra'                    : '8EwzHQkx', // 1.15.21
            'tinkers-construct'           : 'aQ92LlLJ', // 3.11.2.165 (3.12 needs JEI 15.56+, GregTech needs JEI < 15.40)
            'thermal-foundation'          : '44ilyZbi', // 11.0.6
            'embers'                      : 'QNWjEwxw', // 1.20.1-1.4.7
            'applied-mekanistics'         : '9n9p68Qq', // 1.4.3
            'pneumaticcraft-repressurized': 'ohRZqkHb', // 6.0.23
            'electrodynamics'             : 'QyRCuKfr', // 1.20.1-1.0.14
            'nuclearcraft-neoteric'       : 'kefJECnt', // 1.2.36
            'mystical-agriculture'        : 'EEilTecF', // 7.0.24
            'railcraft-reborn'            : 'wNOUeJHM', // 1.1.11
            // Libraries
            'zerocore'                    : 'OIzaNrPI', // 1.20.1-2.1.45
            'silent-lib'                  : 'WGt4877n', // 8.0.0
            'geckolib'                    : 'aC5KMoNg', // 4.8.4
            'modonomicon'                 : 'J0YtwRxM', // 1.20.1-1.79.3
            'curios'                      : 'IPQlZkz1', // 5.14.1
            'smartbrainlib'               : 'YkeJNm33', // 1.15
            'ldlib'                       : 'YSOP0G6O', // 1.0.52.a
            'architectury-api'            : architectury_version,
            'cloth-config'                : 't8TXrZvZ', // 11.1.136
            'titanium'                    : 'LMqbm4db', // 1.20.1-3.8.35
            'patchouli'                   : '94dtOLgZ', // 1.20.1-85
            'rpl'                         : 'PdGBsNte', // 2.1.1
            'resourceful-lib'             : 'OhsHaCcW', // 2.1.29
            'resourceful-config'          : 'DERs8u7v', // 2.1.3
            'botarium'                    : 'O7D6FTfW', // 2.3.4
            'mantle'                      : 'SOJzuYxC', // 1.11.104
            'cofh-core'                   : 'kglS53Hd', // 11.0.2
            'voltaic'                     : 'gYoxJKWw', // 1.20.1-1.0.13
            'cucumber'                    : 'xnLznSfT', // 7.0.16
        ].each { slug, version -> modRuntimeOnly "maven.modrinth:${slug}:${version}" }
    }

    testImplementation platform("org.junit:junit-bom:5.10.2")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

// MNX-039: created items are read at startup, so the GameTest run gets its items.json before launch.
tasks.matching { it.name == 'runUiShots' }.configureEach {
    doFirst {
        delete 'run-ui/screenshots'
        // session.lock: the world may be open in a running game; a copy for screenshots does not need the lock.
        copy { from 'run'; into 'run-ui'; include 'saves/**', 'config/**', 'options.txt'; exclude '**/session.lock' }
        // -Pstore: the store captures, on the dev world as a fresh pack sees it (no Material Nexus settings).
        if (project.hasProperty('store')) delete 'run-ui/config/materialnexus'
    }
}

tasks.matching { it.name == 'runGameTestServer' }.configureEach {
    doFirst { copy { from 'src/gametest-fixtures'; into 'run-gametest' } }
}

tasks.named('test', Test) {
    useJUnitPlatform()
    // The game logging config writes logs/ in the working directory: keep it out of the project root.
    workingDir = layout.buildDirectory.dir("test-run").get().asFile
    doFirst { workingDir.mkdirs() }
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description       : mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into "${layout.buildDirectory.get()}/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata
sourceSets.main.resources.srcDir 'src/generated/resources'
legacyForge.ideSyncTask generateModMetadata

processResources {
    exclude '.cache/**'
}

tasks.named('jar', Jar) {
    from(file('LICENSE')) { into 'META-INF' }
    from(file('LICENSE-ASSETS')) { into 'META-INF' }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
    options.compilerArgs << '-Xlint:deprecation'
}

publishing {
    publications.register('mavenJava', MavenPublication) {
        from components.java
    }
    repositories {
        maven { url = "file://${project.projectDir}/repo" }
    }
}
