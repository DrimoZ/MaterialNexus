plugins {
    id 'java-library'
    id 'maven-publish'
    // Matches the ModDevGradle line used by Immaterial Drawers for NeoForge 1.21.1.
    id 'net.neoforged.moddev' version '2.0.148'
}

version = "${mod_version}+${minecraft_version}"
group = mod_group_id
base { archivesName = mod_id }

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
            gameDirectory = project.file('run')
            systemProperty 'neoforge.enableGameTest', 'true'
        }
        // MNX-049: dev-only UI screenshots. Copies the dev world and config to run-ui (the dev world is never touched),
        // opens the world, walks the Material Nexus screen and saves screenshots to run-ui/screenshots, then quits.
        uiShots {
            client()
            gameDirectory = project.file("run-ui")
            systemProperty "materialnexus.uishots", "true"
            if (project.hasProperty('flow')) systemProperty 'materialnexus.uishots.flow', project.property('flow')
            programArguments.addAll "--quickPlaySingleplayer", "New World", "--width", "2000", "--height", "1070"
        }
        // MNX-144: multiplayer check. A dedicated server of its own (run-mp, offline, port 25599) and a client that joins it,
        // walking the screen as an operator (-Pflow=mpop) or not (-Pflow=mpguest).
        mpServer {
            server()
            gameDirectory = project.file('run-mp')
            programArgument '--nogui'
        }
        uiShotsMp {
            client()
            gameDirectory = project.file("run-ui-mp")
            systemProperty "materialnexus.uishots", "true"
            if (project.hasProperty('flow')) systemProperty 'materialnexus.uishots.flow', project.property('flow')
            programArguments.addAll "--quickPlayMultiplayer", "localhost:25599", "--width", "2000", "--height", "1070"
        }
        server {
            server()
            gameDirectory = project.file('run')
            programArgument '--nogui'
            systemProperty 'neoforge.enableGameTest', 'true'
        }
        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = project.file('run-gametest')
            systemProperty 'neoforge.enableGameTest', 'true'
            // MNX-141: the 26.1 test server resets its world at start; --packs copies the fixture datapacks into it.
            programArguments.addAll '--packs', file('src/gametest-fixtures/datapacks').absolutePath
        }
        data {
            data()
            gameDirectory = project.file('run-data')
            programArguments.addAll '--mod', mod_id,
                    '--all',
                    '--output', file('src/generated/resources/').absolutePath,
                    '--existing', file('src/main/resources/').absolutePath
        }
        configureEach {
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }

    unitTest {
        enable()
        testedMod = mods."${mod_id}"
    }
}

repositories {
    mavenCentral()
    maven {
        name = "BlameJared (JEI)"
        url = "https://maven.blamejared.com"
    }
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content { includeGroup 'maven.modrinth' }
    }
    maven {
        name = "Latvian (KubeJS)"
        url = "https://maven.latvian.dev/releases"
        content { includeGroup 'dev.latvian.mods' }
    }
}

dependencies {
    // Optional viewer integrations: compile against the API, never make the viewer a hard dependency.
    compileOnly "mezz.jei:jei-${jei_minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${jei_minecraft_version}-neoforge-api:${jei_version}"
    // EMI: compiled against for the viewer adapter only; `-Pemi` adds it to the dev run.
    // MNX-140: no official EMI for 26.1.2, adapter excluded below.
    if (project.hasProperty('emi')) {
        runtimeOnly "maven.modrinth:emi:${emi_version}"
    }

    // KubeJS: compiled against for the script bindings only (MNX-067, ADR-001); `-Pkubejs` adds it to the dev runs.
    compileOnly "dev.latvian.mods:kubejs-neoforge:${kubejs_version}"
    compileOnly "dev.latvian.mods:rhino:${rhino_version}"
    if (project.hasProperty("kubejs")) {
        // The Modrinth jars bundle what the Maven artifacts pull from repositories we do not use.
        runtimeOnly "maven.modrinth:kubejs:${kubejs_modrinth}"
        runtimeOnly "maven.modrinth:rhino:${rhino_modrinth}"
        runtimeOnly "maven.modrinth:better-advanced-tooltips:${better_advanced_tooltips_modrinth}"
    }

    // Almost Unified: `-Pau` adds it to the dev runs, to check the domain arbitration (ADR-012) against the real mod.
    if (project.hasProperty("au")) {
        runtimeOnly "maven.modrinth:almostunified:${almostunified_version}"
    }

    // MNX-128: a batch of the most downloaded NeoForge 1.21.1 mods that have recipe types of their own, to read what the
    // recipe rewrite leaves listed (`-Pbatch`, with the recipesAreRewrittenAcrossTheBatch GameTest report).
    if (project.hasProperty("batch")) {
        runtimeOnly "maven.modrinth:tensura-reincarnated:DfQPJq9I" // 2.0.1.4
        runtimeOnly "maven.modrinth:manascore:yhLQMaxS" // 4.0.0.2
        runtimeOnly "maven.modrinth:architectury-api:1IiqEQGl" // 13.0.11+neoforge
        runtimeOnly "maven.modrinth:terrablender:6e8GCrLb" // 4.1.0.8
        runtimeOnly "maven.modrinth:smartbrainlib:O5EpeqI3" // 1.16.11
        runtimeOnly "maven.modrinth:geckolib:Grwn5rUB" // 4.9.3
        runtimeOnly "maven.modrinth:extended-ae:bC302UUP" // 1.21-2.2.35-neoforge
        runtimeOnly "maven.modrinth:glodium:pfbmdJ3b" // 1.21-2.2-neoforge
        runtimeOnly "maven.modrinth:energized-power:EoADEyXb" // 3.0.5+1.21.1-neoforge
        runtimeOnly "maven.modrinth:farmers-delight:XTVZDOol" // 1.21.1-1.3.4
        runtimeOnly "maven.modrinth:ars-nouveau:yWDnir1o" // 5.13.3
        runtimeOnly "maven.modrinth:powah:1prWLuga" // 6.2.10-neoforge
        runtimeOnly "maven.modrinth:cloth-config:izKINKFg" // 15.0.140+neoforge
        runtimeOnly "maven.modrinth:silent-gear:VRVOMdub" // 4.2.1.1
        runtimeOnly "maven.modrinth:silent-lib:xavD8Lt3" // 10.6.0
        runtimeOnly "maven.modrinth:oritech:BR0KKypH" // 1.2.13
        runtimeOnly "maven.modrinth:athena-ctm:dJgL278E" // 4.0.6
        runtimeOnly "maven.modrinth:create-ore-excavation:tivxiPTo" // 1.21.1-1.6.8
    }

    // A small real pack for the dev runs: overlapping copper/tin/zinc/aluminum providers are what
    // discovery and resolution exist for. runtimeOnly, never compiled against or shipped.
    if (!project.hasProperty('vanilla')) {
        runtimeOnly "mezz.jei:jei-${jei_minecraft_version}-neoforge:${jei_version}"
        // MNX-139: the content mods that have a NeoForge 26.1.2 build (Modrinth version ids, 2026-11-04). They overlap on silver,
        // nickel, platinum, steel and the vanilla metals' dusts, nuggets and plates; several are alpha or beta builds.
        runtimeOnly "maven.modrinth:jade:${jade_version}"
        runtimeOnly "maven.modrinth:occultism:FGf3SQAs" // 26.1.2-neoforge-1.262.0
        runtimeOnly "maven.modrinth:modonomicon:PoZW527q" // 26.1.2-2.20.0
        runtimeOnly "maven.modrinth:curios:dRnRThvD" // 15.0.0+26.1.2
        runtimeOnly "maven.modrinth:geckolib:xfVfPcoC" // 5.5.2
        runtimeOnly "maven.modrinth:oritech:eCP3mBH7" // 2.0.0-exp12, beta
        runtimeOnly "maven.modrinth:athena-ctm:8KRMFzZ7" // 4.7.3
        runtimeOnly "maven.modrinth:silent-gear:eG4f2c3T" // 4.2.3
        runtimeOnly "maven.modrinth:silent-lib:Rc4eCDXl" // 11.2.0
        runtimeOnly "maven.modrinth:ex-deorum:udQ4yulx" // 4.0
        runtimeOnly "maven.modrinth:jaopca:AaMsk07b" // 26.1.2-6.0.2.2, alpha
        runtimeOnly "maven.modrinth:mystical-agriculture:euEwsQlw" // 9.0.11
        runtimeOnly "maven.modrinth:extended-crafting:soXMrjKe" // 8.0.3
        runtimeOnly "maven.modrinth:cucumber:SSzjv5lL" // 9.0.7
        runtimeOnly "maven.modrinth:ae2:nVSxZcom" // 26.1.13-beta
        runtimeOnly "maven.modrinth:guideme:OTeLaTlN" // 26.1.17-beta
        runtimeOnly "maven.modrinth:powah:bymXTkIP" // 7.0.4-alpha
        runtimeOnly "maven.modrinth:cloth-config:TimoYzse" // 26.1.154+neoforge
        runtimeOnly "maven.modrinth:cyclic:1RispO3t" // 26.1.2-1.14.2, alpha
        runtimeOnly "maven.modrinth:flib:uMEW9ig6" // 26.1.2-0.2.11
        runtimeOnly "maven.modrinth:enderio:SNsMXOPB" // v9.0.6, alpha
    }
    // MNX-138: still the 1.21.1 builds, which NeoForge 26.1.2 refuses to load; `-Pcontent` keeps the list at hand, and
    // MNX-139 moves each mod back above once it has an official 26.1.2 build.
    if (project.hasProperty('content')) {
        runtimeOnly "maven.modrinth:mekanism:${mekanism_version}"
        runtimeOnly "maven.modrinth:create:${create_version}"
        runtimeOnly "maven.modrinth:immersiveengineering:${immersiveengineering_version}"
        runtimeOnly "maven.modrinth:ex-deorum:${ex_deorum_version}"
        runtimeOnly "maven.modrinth:ae2:${ae2_version}"
        runtimeOnly "maven.modrinth:modern-industrialization:${modern_industrialization_version}"
        runtimeOnly "maven.modrinth:guideme:${guideme_version}"
        // Addons and metal-heavy mods: more overlapping providers, recipe types and tag conventions.
        runtimeOnly "maven.modrinth:mekanism-generators:${mekanism_version}"
        runtimeOnly "maven.modrinth:mekanism-tools:${mekanism_version}"
        runtimeOnly "maven.modrinth:immersivepetroleum:${immersivepetroleum_version}"
        runtimeOnly "maven.modrinth:createaddition:${createaddition_version}"
        runtimeOnly "maven.modrinth:create-new-age:${create_new_age_version}"
        runtimeOnly "maven.modrinth:create-metallurgy:${create_metallurgy_version}"
        runtimeOnly "maven.modrinth:oritech:${oritech_version}"
        runtimeOnly "maven.modrinth:architectury-api:${architectury_version}"
        runtimeOnly "maven.modrinth:geckolib:${geckolib_version}"
        runtimeOnly "maven.modrinth:athena-ctm:${athena_version}"
        runtimeOnly "maven.modrinth:remin:${remin_version}"
        runtimeOnly "maven.modrinth:extreme-reactors:${extreme_reactors_version}"
        runtimeOnly "maven.modrinth:zerocore:${zerocore_version}"
        runtimeOnly "maven.modrinth:silent-gear:${silent_gear_version}"
        runtimeOnly "maven.modrinth:silent-lib:${silent_lib_version}"
        runtimeOnly "maven.modrinth:occultism:${occultism_version}"
        runtimeOnly "maven.modrinth:smartbrainlib:${smartbrainlib_version}"
        runtimeOnly "maven.modrinth:curios:${curios_version}"
        runtimeOnly "maven.modrinth:modonomicon:${modonomicon_version}"
    }

    testImplementation platform("org.junit:junit-bom:5.10.2")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

// MNX-039: created items are read at startup, so the GameTest run gets its items.json before launch.
tasks.matching { it.name == 'runUiShots' }.configureEach {
    doFirst {
        delete 'run-ui/screenshots'
        // MNX-139: -Pflow=after keeps the world and config of the last -Pflow=fresh run, to see them after a restart.
        if (project.findProperty('flow') in ['after', 'more', 'views']) return
        if (project.findProperty('flow') == 'fresh') {
            // A world the game makes now, no config from the dev runs, and one created item with its own colour (tint check).
            delete 'run-ui/saves', 'run-ui/config'
            copy { from 'run'; into 'run-ui'; include 'options.txt' }
            file('run-ui/config/materialnexus').mkdirs()
            file('run-ui/config/materialnexus/items.json').text = '{ "items": [ { "material": "silver", "form": "gear", "color": "#D04040" } ] }'
            return
        }
        // MNX-142: a copy over a world the game already upgraded mixes versions and stops on a confirmation; start clean.
        delete 'run-ui/saves'
        // session.lock: the world may be open in a running game; a copy for screenshots does not need the lock.
        copy { from 'run'; into 'run-ui'; include 'saves/**', 'config/**', 'options.txt'; exclude '**/session.lock' }
        // -Pstore: the store captures, on the dev world as a fresh pack sees it (no Material Nexus settings).
        if (project.hasProperty('store')) delete 'run-ui/config/materialnexus'
    }
}

tasks.matching { it.name == 'runGameTestServer' }.configureEach {
    doFirst { copy { from 'src/gametest-fixtures'; into 'run-gametest' } }
}

tasks.named('test', Test) {
    useJUnitPlatform()
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description       : mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into "${layout.buildDirectory.get()}/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata
sourceSets.main.resources.srcDir 'src/generated/resources'
neoForge.ideSyncTask generateModMetadata

processResources {
    exclude '.cache/**'
}

tasks.named('jar', Jar) {
    from(file('LICENSE')) { into 'META-INF' }
    from(file('LICENSE-ASSETS')) { into 'META-INF' }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
    options.compilerArgs << '-Xlint:deprecation'
}

publishing {
    publications.register('mavenJava', MavenPublication) {
        from components.java
    }
    repositories {
        maven { url = "file://${project.projectDir}/repo" }
    }
}

// MNX-140: EMI has no official 26.1.2 build; the adapter is left out until one exists.
sourceSets.main.java.exclude 'dev/drimoz/materialnexus/client/compat/emi/**'

// MNX-138: tests run inside the mod module on 26.1, where a resource folder cannot be listed; this one is passed by path.
tasks.named('test') {
    systemProperty 'mnx.recipeFormats', file('src/main/resources/data/materialnexus/material_nexus/recipe_formats').absolutePath
}

// MNX-144: the multiplayer server accepts the EULA for its own test folder, runs offline on 25599, and -Pop makes the
// dev player (offline UUID of "Dev") an operator; without it the player is a guest.
tasks.matching { it.name == 'runMpServer' }.configureEach {
    doFirst {
        file('run-mp').mkdirs()
        file('run-mp/eula.txt').text = 'eula=true\n'
        file('run-mp/server.properties').text = 'online-mode=false\nserver-port=25599\nspawn-protection=0\n'
        def uuid = UUID.nameUUIDFromBytes('OfflinePlayer:Dev'.getBytes('UTF-8'))
        file('run-mp/ops.json').text = project.hasProperty('op')
                ? "[{\"uuid\":\"${uuid}\",\"name\":\"Dev\",\"level\":2,\"bypassesPlayerLimit\":false}]" : '[]'
    }
}
tasks.matching { it.name == 'runUiShotsMp' }.configureEach {
    doFirst { delete 'run-ui-mp/screenshots'; copy { from 'run'; into 'run-ui-mp'; include 'options.txt' } }
}
