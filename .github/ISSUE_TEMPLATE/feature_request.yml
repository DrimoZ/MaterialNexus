name: Feature request
description: Something the mod should do, or do differently.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you are trying to do
      description: The pack-making problem, before the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you propose
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: How you do it today
      description: Datapack, rule file, KubeJS script, another mod.
  - type: markdown
    attributes:
      value: |
        By design the mod unifies nothing on its own, never scans the world or inventories, and
        never removes or generates recipes without an explicit decision. Requests that need one of
        these will be declined.
